[project]
name = "advanced-rag"
version = "0.1.0"
description = "Advanced RAG playground: PDF ingestion, chunking, Ollama embeddings and Pinecone vector search."
readme = "README.md"
authors = [
    { name = "DenKozlov", email = "den.kozlov1984@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-ollama>=0.2",
    "langchain-pinecone>=0.2",
    "langchain-google-genai>=2.0",
    "pinecone>=5.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "ragas>=0.4.4",
    "langchain-groq>=1.2.1",
    "langfuse>=5.2.0",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
files = ["src"]
